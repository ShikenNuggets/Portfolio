name: Generate and Deploy Resume

on:
  push:
    branches: [ main ]
    paths:
      - 'content/resume.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install RenderCV
        # RenderCV 2.3 imports click.core.Parameter directly; typer>=0.26 vendored Click
        # and dropped it as a dependency, causing rendercv.cli to mask the ImportError.
        run: pip install "rendercv[full]==2.3" "typer<0.26" "click<9"

      - name: Generate CV
        run: rendercv render content/resume.yml

      - name: Copy PDF to Public Folder
        run: |
          mkdir -p public
          # This finds the PDF in the output folder and renames it to resume.pdf
          cp rendercv_output/*.pdf public/resume.pdf

      - name: Commit and Push PDF
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update resume pdf [skip ci]"
          file_pattern: 'public/resume.pdf'
